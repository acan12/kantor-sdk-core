  chucker_flutter: ^1.9.1
  shared_preferences: ^2.5.5
#  flutter_svg: ^2.0.10+1
  package_info_plus: ^8.3.0
  jwt_decode_full: ^0.9.2
#  qr_flutter: ^4.1.0
#  emvqrcode: ^1.0.5
  local_auth: ^3.0.1
  local_auth_android: ^2.0.0
  local_auth_darwin: ^2.0.0

  authentication_sdk:
    path: sdk-core/authentication_sdk
  identity_sdk:
    path: sdk-core/identity_sdk
  transaction_sdk:
    path: sdk-core/transaction_sdk
  shared_library:
    path: sdk-core/shared_library

dev_dependencies:
  flutter_flavorizr: ^2.4.2
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  retrofit_generator: ^10.2.5
  hive_ce_generator: ^1.7.0

