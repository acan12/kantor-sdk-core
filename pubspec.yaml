  go_router: ^16.2.0                      # Router
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  json_serializable: ^6.3.1
  retrofit: ^4.9.2 #^3.0.1+1
  logger: ^1.0.0
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  intl: ^0.20.0                           # Format dates
#  easy_localization: ^3.0.8          # i18n language
  freezed: ^3.2.5
  firebase_core: ^3.13.1
  flutter_secure_storage: ^10.0.0
#  cached_network_image: ^3.3.0
#  file_picker: ^8.1.6
#  image_picker: ^1.1.2
